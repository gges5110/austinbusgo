name: Update GTFS data

# The GTFS data ships inside the backend image (see deployBackend.yml), so
# picking up a new CapMetro feed means rebuilding and redeploying the
# backend. Runs nightly and is a cheap no-op when the feed is unchanged.
# ETL changes merged to main deploy through main.yml.

on:
  schedule:
    # Runs "At 00:00." (see https://crontab.guru)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  deploy-backend:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployBackend.yml
    with:
      only_if_feed_changed: true
    secrets: inherit
