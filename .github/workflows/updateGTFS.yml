name: Update GTFS database on a CRON Schedule

on:
  schedule:
    # Runs "At 00:00." (see https://crontab.guru)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v3
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/761140212463/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@austin-bus-go.iam.gserviceaccount.com
      - name: Set up Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port=5432 austin-bus-go:us-central1:austinbusgo-db &
          sleep 3
      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install PostgresClient
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run GTFS ETL Pipeline
        run: python main.py
        env:
          DATABASE_URL: ${{ secrets.DBURI }}
