# GitHub Actions Workflow for Continuous Deployment

name: Main

# Triggers the workflow on pushes to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client
        working-directory: ./client
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_GTFS_RT_PROXY_URL: ${{ secrets.VITE_GTFS_RT_PROXY_URL }}
        run: npm run build

      # Static per-stop/per-route pages (HTTP 200, own title/canonical) and
      # the sitemap, so search engines can index more than the home page
      - name: Prerender stop and route pages
        working-directory: ./client
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run prerender

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Google the sitemap changed (new stops/routes after a feed update).
  # Google re-fetches submitted sitemaps on its own, so this only speeds up
  # discovery; it never fails the deploy. Needs the CI service account to be
  # a Full user on the Search Console property (Restricted can't submit).
  submit-sitemap:
    needs: deploy-client
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/761140212463/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@austin-bus-go.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
          access_token_lifetime: 300s

      - name: Submit sitemap to Search Console
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SITE: sc-domain:austinbusgo.com
          SITEMAP: https://austinbusgo.com/sitemap.xml
        run: |
          encode() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          url="https://www.googleapis.com/webmasters/v3/sites/$(encode "$SITE")/sitemaps/$(encode "$SITEMAP")"
          status=$(curl -s -o response.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" "$url")
          if [ "$status" = "204" ] || [ "$status" = "200" ]; then
            echo "Submitted $SITEMAP"
          else
            echo "::warning::Sitemap submission failed (HTTP $status): $(cat response.json)"
          fi

  deploy-server:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deployBackend.yml
    secrets: inherit
