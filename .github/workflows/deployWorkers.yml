# Deploys the Cloudflare Workers in workers/ when their code changes on main.
#
# graphql-edge-cache is not here on purpose: deployBackend.yml deploys it
# with a fresh CACHE_VERSION after each data load, and a plain deploy would
# reset that version.

name: Deploy Workers

on:
  push:
    branches:
      - main
    paths:
      - "workers/events/**"
      - "workers/gtfs-rt-proxy/**"
      - ".github/workflows/deployWorkers.yml"
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker to deploy"
        type: choice
        options:
          - all
          - events
          - gtfs-rt-proxy
        default: all

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.pick.outputs.workers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            events:
              - 'workers/events/**'
              - '.github/workflows/deployWorkers.yml'
            gtfs-rt-proxy:
              - 'workers/gtfs-rt-proxy/**'
              - '.github/workflows/deployWorkers.yml'
      - name: Pick workers
        id: pick
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          CHOICE: ${{ inputs.worker }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$CHOICE" = "all" ]; then
              echo 'workers=["events","gtfs-rt-proxy"]' >> "$GITHUB_OUTPUT"
            else
              echo "workers=[\"$CHOICE\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "workers=${CHANGED:-[]}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.workers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.detect-changes.outputs.workers) }}
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run --if-present typecheck

      - name: Test
        run: npm run --if-present test

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
