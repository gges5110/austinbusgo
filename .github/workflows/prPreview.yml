name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  GCP_REGION: us-central1
  IMAGE: gcr.io/austin-bus-go/austinbusgo-backend
  CLOUD_RUN_SERVICE: austinbusgo-backend
  WORKLOAD_IDENTITY_PROVIDER: projects/761140212463/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions@austin-bus-go.iam.gserviceaccount.com

jobs:
  deploy-preview-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }} \
            -f server/Dockerfile .
          docker push ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}

      - name: Deploy to Cloud Run (tagged, no traffic)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
          tag: pr-${{ github.event.pull_request.number }}
          no_traffic: true
          env_vars: |
            DATABASE_URL=${{ secrets.DBURI }}

  deploy-preview-client:
    runs-on: ubuntu-latest
    needs: deploy-preview-backend
    permissions:
      contents: write
    outputs:
      preview_url: ${{ steps.set-url.outputs.preview_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Client
        working-directory: ./client
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_API_BASE: ${{ needs.deploy-preview-backend.outputs.backend_url }}
          VITE_BASE: /austinbusgo/pr-preview/pr-${{ github.event.pull_request.number }}/
        run: npm run build

      - name: Deploy to GitHub Pages (PR subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/build
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Set preview URL output
        id: set-url
        run: |
          echo "preview_url=https://gges5110.github.io/austinbusgo/pr-preview/pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_OUTPUT"

  comment-preview-urls:
    runs-on: ubuntu-latest
    needs: [deploy-preview-backend, deploy-preview-client]
    permissions:
      pull-requests: write

    steps:
      - name: Post or update PR preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const frontendUrl = '${{ needs.deploy-preview-client.outputs.preview_url }}';
            const backendUrl = '${{ needs.deploy-preview-backend.outputs.backend_url }}';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('## PR Preview')
            );

            const body = [
              '## PR Preview',
              '',
              '| Environment | URL |',
              '|---|---|',
              `| Frontend | [Open preview](${frontendUrl}) |`,
              `| Backend (GraphiQL) | [Open GraphiQL](${backendUrl}/graphql) |`,
              '',
              `_Updated: ${new Date().toUTCString()}_`,
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
