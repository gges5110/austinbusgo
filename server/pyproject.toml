[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "austinbusgo-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.1",
    # Database / ORM
    "sqlalchemy[asyncio]==2.0.36",
    "geoalchemy2==0.15.2",
    "asyncpg==0.30.0",
    # GTFS
    "gtfs-realtime-bindings==1.0.0",
    "shapely==2.1.2",
    "pytz==2025.2",
    # Production server (Gunicorn + UvicornWorker)
    "gunicorn==22.0.0",
]

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "pytest==8.3.5",
    "pytest-mock==3.12.0",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.24.0",
    "coverage==7.13.4",
    # Integration tests
    "testcontainers[postgres]>=4.0.0",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.py$'

[tool.pytest.ini_options]
asyncio_mode = "auto"
