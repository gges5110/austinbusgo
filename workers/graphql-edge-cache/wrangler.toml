name = "graphql-edge-cache"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
UPSTREAM_ORIGIN = "https://austinbusgo-backend-761140212463.us-central1.run.app"
# Rotated by the updateGTFS workflow (deploy --var) after each data load
CACHE_VERSION = "v1"

# Per-IP limit on requests that reach the backend (cache misses and
# uncached paths; hits are never limited). See src/limit.ts.
[[ratelimits]]
name = "MISS_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
