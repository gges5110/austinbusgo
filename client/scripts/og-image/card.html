<!--
  Source for public/og-image.png (1200x630 social preview). Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
    --screenshot=public/og-image.png "file://$PWD/scripts/og-image/card.html"
-->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family:
          -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        background: #12203a;
        color: #fff;
        position: relative;
      }
      /* Faint street grid, suggesting a map without being one */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 2px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 2px);
        background-size: 64px 64px;
        transform: rotate(-14deg) scale(1.4);
      }
      .route-line {
        position: absolute;
        left: 640px;
        top: -40px;
        width: 10px;
        height: 760px;
        background: #2f7df6;
        border-radius: 6px;
        transform: rotate(18deg);
        opacity: 0.85;
      }
      .stop {
        position: absolute;
        left: 641px;
        top: 284px;
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: #e2231a;
        border: 5px solid #fff;
      }
      .bus {
        position: absolute;
        left: 718px;
        top: 70px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #f5a623;
        border: 5px solid #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 22px;
        color: #12203a;
      }
      .content {
        position: absolute;
        left: 72px;
        top: 76px;
        width: 600px;
      }
      h1 {
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -1.5px;
        line-height: 1.02;
      }
      .tagline {
        margin-top: 20px;
        font-size: 34px;
        line-height: 1.25;
        color: #c8d6f0;
      }
      .card {
        position: absolute;
        left: 72px;
        top: 352px;
        width: 600px;
        background: #fff;
        color: #12203a;
        border-radius: 22px;
        padding: 10px 26px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 0;
      }
      .row + .row {
        border-top: 2px solid #e8edf5;
      }
      .badge {
        min-width: 70px;
        text-align: center;
        padding: 6px 10px;
        border-radius: 8px;
        color: #fff;
        font-weight: 800;
        font-size: 26px;
      }
      .dest {
        flex: 1;
        font-size: 26px;
        font-weight: 600;
      }
      .dest small {
        display: block;
        font-size: 20px;
        font-weight: 500;
        color: #6b7a90;
        margin-top: 2px;
      }
      .eta {
        font-size: 30px;
        font-weight: 800;
        color: #0a8a3a;
      }
      .arriving {
        font-size: 20px;
        font-weight: 800;
        color: #fff;
        background: #d93025;
        border-radius: 18px;
        padding: 6px 14px;
      }
      .domain {
        position: absolute;
        right: 64px;
        bottom: 44px;
        font-size: 30px;
        font-weight: 700;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="route-line"></div>
    <div class="bus">801</div>
    <div class="stop"></div>

    <div class="content">
      <h1>Austin Bus Go</h1>
      <p class="tagline">Live bus arrivals for the stop you're at</p>
    </div>

    <div class="card">
      <div class="row">
        <span class="badge" style="background: #5b6573">801</span>
        <span class="dest">Tech Ridge<small>2 stops away</small></span>
        <span class="arriving">Arriving</span>
      </div>
      <div class="row">
        <span class="badge" style="background: #2f7df6">7</span>
        <span class="dest">Duval<small>5 stops away</small></span>
        <span class="eta">6 min</span>
      </div>
    </div>

    <div class="domain">austinbusgo.com</div>
  </body>
</html>
