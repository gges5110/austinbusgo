  <meta name="description" content="Track Austin public transit in real-time. Find bus routes, stops, and arrival times for Capital Metro buses. Get live transit updates and directions for Austin, Texas." />

  <meta property="og:title" content="Austin Bus Go - Real-Time Austin Transit Tracker" />

  <meta property="og:site_name" content="Austin Bus Go" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://austinbusgo.com/" />
  <meta name="twitter:title" content="Austin Bus Go - Real-Time Austin Transit Tracker" />
  <meta name="twitter:description" content="Track Austin public transit in real-time. Find bus routes, stops, and arrival times for Capital Metro buses." />

    Notice the use of %PUBLIC_URL% in the tags above.

  <title>Austin Bus Go - Real-Time Austin Transit Tracker</title>

<!-- Structured Data for SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Austin Bus Go",
  "description": "Track Austin public transit in real-time. Find bus routes, stops, and arrival times for Capital Metro buses.",
  "url": "https://austinbusgo.com",
  "applicationCategory": "TravelApplication",
  "operatingSystem": "Web Browser",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.5",
    "ratingCount": "100"
  },
  "author": {
    "@type": "Organization",
    "name": "Austin Bus Go"
  },
  "areaServed": {
    "@type": "City",
    "name": "Austin",
    "@id": "https://www.wikidata.org/wiki/Q16559",
    "containedInPlace": {
      "@type": "State",
      "name": "Texas"
    }
  },
  "provider": {
    "@type": "Organization",
    "name": "Capital Metro",
    "url": "https://www.capmetro.org"
  }
}
</script>

<div id="root" style="height:100vh"></div>
<script type="module" src="/src/index.tsx"></script>
